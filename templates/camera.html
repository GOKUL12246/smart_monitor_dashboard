<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Camera - Temple Monitor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Sora', 'Segoe UI', sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(34, 197, 94, 0.16), transparent 36%),
        radial-gradient(circle at 75% 15%, rgba(14, 165, 233, 0.2), transparent 32%),
        linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      color: #e2e8f0;
    }

    .camera-shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px;
    }

    .camera-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .back-btn {
      text-decoration: none;
      color: #e2e8f0;
      border: 1px solid rgba(226, 232, 240, 0.28);
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: rgba(148, 163, 184, 0.18);
      transform: translateY(-1px);
    }

    .live-pill {
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(239, 68, 68, 0.18);
      border: 1px solid rgba(248, 113, 113, 0.45);
      color: #fecaca;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .hero {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(226, 232, 240, 0.18);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 40px rgba(2, 6, 23, 0.35);
    }

    .hero-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .hero-title {
      font-size: 1.3rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hero-title i {
      color: #38bdf8;
    }

    .feed-wrap {
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: #020617;
    }

    .feed-wrap img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .meta .chip {
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.24);
      padding: 10px 12px;
      font-size: 0.88rem;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="camera-shell">
    <div class="camera-nav">
      <a href="/dashboard" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
      <div class="live-pill"><i class="fas fa-circle"></i> LIVE MONITOR</div>
    </div>

    <div class="hero">
      <div class="hero-head">
        <div class="hero-title"><i class="fas fa-camera"></i> Entry Gate Live Feed</div>
        <div>Temple Smart Monitoring</div>
      </div>
      <div class="feed-wrap">
        <img src="{{ url_for('camera_feed') }}" alt="Live camera feed">
      </div>
      <div class="meta">
        <div class="chip"><i class="fas fa-bolt"></i> Real-time stream</div>
        <div class="chip"><i class="fas fa-user-shield"></i> Crowd safety AI enabled</div>
        <div class="chip"><i class="fas fa-network-wired"></i> System connected</div>
      </div>
    </div>
  </div>
</body>
</html>
